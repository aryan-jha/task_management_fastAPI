[project]
name = "fast"
version = "0.1.0"
description = "FastAPI backend with users, tasks, JWT auth, and email"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "psycopg[binary]",
    "PyJWT",
    "pwdlib[argon2]",
    "fastapi-mail",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
